---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: kyber
# description will be included in the image's metadata
description: >-
  KYBER OS — a dedicated gaming console built from a 3D-printed enclosure and a
  custom image derived from Bazzite. Boots straight into the KYBER launcher: a
  gamescope session wrapping a kiosk browser, no desktop behind it.

# the base image to build on top of (FROM) and the version tag to use
#
# bazzite-deck, not bazzite: gamescope-session-plus and its sessions.d/ hook
# live in Bazzite's `bazzite-deck` build stage only. That hook is the whole
# reason the KYBER session is two declarative files instead of a session script
# we would have to maintain ourselves.
base-image: ghcr.io/ublue-os/bazzite-deck
image-version: stable # Bazzite's recommended channel; `testing` and `unstable` also exist

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  # Depois do módulo `files`, que é quem deposita o launcher e o pacote do
  # gameprofiled na árvore. O symlink que este script cria mora dentro do
  # diretório do launcher, e o launcher só existe a partir dali.
  - type: script
    scripts:
      - kyber-gameprofiled.sh

  - type: dnf
    install:
      packages:
        # Bazzite removes Firefox and ships it as a Flatpak, so the image has no
        # browser to run in kiosk mode. Chromium has the most complete Gamepad
        # API support of the packaged options, which the launcher depends on.
        - chromium
        # Serves the launcher over loopback. The launcher is 38 ES modules plus
        # a fetch(); over file:// the browser's CORS rules block both and the
        # screen stays blank. 63 KB installed.
        - darkhttpd
        # O plugin de splash com que o tema do KYBER é escrito. O two-step,
        # que já vem na imagem, faz todo o resto do desenho — cores exatas,
        # barra de 5px em tela cheia colada na base, wordmark centralizado —
        # e não faz UMA coisa: box-shadow. O brilho da barra é parte do
        # desenho e não enfeite, e é só por ele que este pacote entra.
        - plymouth-plugin-script

  # gameprofiled has no package of its own: it is stdlib-only Python, laid
  # into /usr/lib/kyber/ by the `files` module above. Nothing to install —
  # python3 already ships in the base image, and the script module above
  # fails the build if that ever stops being true.

  # `user-tmpfiles.d` e nao `tmpfiles.d`: a limpeza e por sessao de
  # usuario e usa %t, que so resolve para XDG_RUNTIME_DIR na instancia de
  # usuario do systemd-tmpfiles. O arquivo vem pelo modulo `files` acima;
  # nao ha unit a habilitar, porque quem o processa e o
  # systemd-tmpfiles-setup.service que ja roda em toda sessao.

  - type: systemd
    system:
      enabled:
        - kyber-launcher.service
        # Reescreve /etc/sddm.conf.d/zzz-kyber-autologin.conf a cada boot.
        # O arquivo já foi conteúdo de imagem e sumiu de /etc duas vezes
        # numa sessão — num sistema ostree a deleção é modificação local e
        # é PRESERVADA no deploy seguinte, então ele não voltava sozinho e
        # o console abria no Game Mode do Bazzite sem explicar por quê.
        # Depender de um arquivo de /etc nunca ser tocado é depender de
        # promessa que o ostree não faz.
        - kyber-autologin.service
        # Publica /run/kyber/state.json, que o launcher lê pelo symlink
        # servido pelo darkhttpd. Sem ele a interface sobe inteira e
        # desenha SEM LEITURA — o launcher não depende do daemon para
        # abrir, e é assim que tem que ser.
        - kyber-gameprofiled.service
        # Traduz HTTP em comando de socket, sem privilégio. É a única
        # peça que o launcher alcança para GRAVAR perfil; a leitura
        # continua sendo arquivo servido pelo darkhttpd, e por isso o
        # editor abre certo mesmo com esta unit fora do ar.
        - kyber-api.service

    user:
      enabled:
        # Os quatro verbos de energia da tela 12, em 127.0.0.1:8789.
        # É unit de USUÁRIO e não de sistema, e essa é a decisão: no
        # logind, power-off/reboot/suspend são allow_active=yes, então
        # quem está com a sessão ativa na frente do console já pode
        # desligá-lo. Rodando sob o `systemd --user` da pessoa, esta peça
        # não ganha autoridade nenhuma — empresta a dela para quem não
        # tem teclado. Pôr energia no kyber-api teria feito o contrário:
        # dar poder de desligar a máquina ao usuário escolhido
        # justamente por não ter poder nenhum.
        - kyber-power.service

  # A kyber-session-desktop.service NÃO é habilitada e não aparece aqui:
  # ela é ACIONADA pelo kyber-power, com a autorização do
  # /usr/share/polkit-1/rules.d/50-kyber-session-desktop.rules. Unit de
  # energia que subisse no boot seria o oposto do que se quer.

  # ÚLTIMO DE PROPÓSITO, e o módulo pede isso por escrito. Ele regenera o
  # initramfs com dracut, uma vez por kernel, e o que entra lá dentro é o
  # estado da árvore NAQUELE instante — inclusive o tema do plymouth, que o
  # plymouth-populate-initrd resolve consultando o
  # /usr/share/plymouth/plymouthd.defaults depositado pelo módulo `files`
  # lá em cima.
  #
  # SEM ISTO O TEMA NÃO APARECE. O plymouth do boot roda de dentro do
  # initramfs, e um initramfs que não foi regenerado continua carregando o
  # tema anterior — a imagem builda verde, o arquivo está no lugar certo em
  # /usr, e a tela continua mostrando o splash do Bazzite.
  #
  # É A ÚNICA MUDANÇA DESTA IMAGEM QUE PODE FAZER O CONSOLE NÃO BOOTAR. O
  # dracut lê /usr/lib/dracut/dracut.conf.d/, então a configuração do
  # próprio ublue é respeitada, mas um initramfs regenerado é um initramfs
  # novo. O conserto está no README, em "Rolling back", escrito para ser
  # executado sem raciocinar.
  #
  # Custo: um dracut por kernel no CI (+1 a 3 min sobre os 4 a 7 de hoje) e
  # o initramfs.img passando a ser arquivo desta camada. No console, custo
  # ZERO — o caminho documentado do Bazzite é `rpm-ostree initramfs
  # --enable`, que faz a MÁQUINA regenerar a cada update; fazer no build
  # compra isso de volta.
  - type: initramfs

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
