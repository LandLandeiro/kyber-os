#  As sobras que o gamescope-session-plus deixa em /run/user.
#
#  Ele cria um diretório por sessão com `mktemp -d` e não o remove ao
#  encerrar. Num console que liga e desliga todo dia, acumula: seis
#  diretórios gamescope.XXXXXXX depois de um dia de testes. É tmpfs e é
#  pequeno, mas vazar por login é vazar.
#
#  O vazamento é do upstream, a limpeza é nossa. Isto roda no início de
#  cada sessão de usuário, ANTES de o gamescope subir, então varre as
#  sobras das sessões anteriores sem tocar na que está começando.
#
#  Por que não um `trap` no nosso sessions.d/kyber: aquele arquivo é
#  `source`d dentro do shell do gamescope-session-plus sob `set -a`. Um
#  trap de EXIT ali ou atropela o do upstream ou precisa ser encadeado com
#  `trap -p` — e falharia calado, que é o pior jeito de uma limpeza
#  falhar.
#
#  Regra frouxa de propósito: se o upstream corrigir o vazamento, isto
#  não tem o que remover e não custa nada. Se mudar o nome do diretório,
#  para de funcionar em silêncio — é higiene, não correção.
#
#  O `!` restringe a linha ao boot da instância, e é escolha deliberada
#  entre dois modos de falhar. Sem ele, um `systemd-tmpfiles --user
#  --create --remove` disparado por qualquer motivo no meio de uma sessão
#  apagaria o diretório da sessão VIVA e derrubaria o gamescope. Com ele,
#  o pior caso é a linha nunca rodar e o vazamento continuar. Um console
#  que acumula diretórios de 4 KB é um aborrecimento; um console cuja
#  sessão morre sozinha não é.
#
#  NÃO VERIFICADO EM HARDWARE: se a instância de usuário do
#  systemd-tmpfiles-setup não passar `--boot`, esta linha é ignorada e a
#  limpeza não acontece. Ver a nota no README.
#
