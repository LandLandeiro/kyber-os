# O usuário do kyber-api, e o grupo que dá acesso ao socket do daemon.
#
# systemd-sysusers processa este arquivo no boot e escreve em /etc, que é
# mutável por máquina — é o caminho certo numa imagem OSTree, onde /usr é
# read-only e um `useradd` em tempo de build não teria onde gravar.
#
# POR QUE NÃO `nobody`. O darkhttpd roda como nobody, e nobody é
# compartilhado por projeto com todo serviço que não precisa de
# privilégio. Dar a nobody escrita num socket que reconfigura o hardware
# entregaria esse acesso a qualquer outro serviço que um dia rode como
# nobody. O darkhttpd, aliás, não encosta no socket: ele serve arquivo.
#
# POR QUE NÃO `DynamicUser=yes` na unit, que parece feito para isto: o
# gid seria transitório, e o gameprofiled precisa resolver o grupo no
# start DELE — que acontece antes de o kyber-api existir. Grupo estático
# é o que faz o chown do socket ter alvo.
u kyber-api - "KYBER launcher API" - -
