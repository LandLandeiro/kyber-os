# Faz o autologin cair no KYBER em vez do Game Mode do Bazzite.
#
# O prefixo zzz não é estético: o SDDM lê /etc/sddm.conf.d/ em ordem alfabética
# e o último arquivo vence, então este precisa ordenar depois do
# zz-bazzite-autologin.conf que o bazzite-autologin.service reescreve a cada
# boot (ele aponta para gamescope-session-ogui-steam.desktop).
#
# Só Session é definido, e de propósito. O SDDM mescla os arquivos por chave,
# não por arquivo: User continua vindo do arquivo do Bazzite, que o calcula em
# tempo de boot com `id -nu 1000`. Fixar um nome de usuário aqui seria chutar em
# build time um dado que só existe depois da instalação.
[Autologin]
Session=kyber.desktop
